<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPlayer</title>
</head>

<body>
    <header>
        <h1 id="logo">MPlayer Media</h1>
    </header>
    <nav>
        <a target="_blank" href="About.html">About |</a>
        <a target="_blank" href="Home.html">Home</a>
    </nav>
    <main>
        <section>
            <h2> Relaxed Music</h2>
            <article>
                <h3>Nature Music</h3>
                <audio src="chill.mp3" controls muted preload="metadata"></audio>
                <audio src="Champion-chosic.com_.mp3" controls muted preload="metadata"></audio>
                <audio src="Beauty(chosic.com).mp3" controls muted preload="metadata" loop></audio>
            </article>
            <article>
                <h3>Birds Sound therapy</h3>
                <audio src="Evening-Improvisation-with-Ethera(chosic.com).mp3" controls muted preload="metadata"
                    loop></audio>
                <audio src="MANTRON(chosic.com).mp3" controls muted preload="metadata" loop></audio>
                <audio src="maxkomusic-heroism(chosic.com).mp3" controls muted preload="metadata" loop></audio>
            </article>
        </section>
        <section>
            <h2>Video Content</h2>
            <article class="videos">
                <h3>1.Educational Content</h3>
                <iframe width="560" height="315" src="https://www.youtube.com/embed/AB3J8ufDYHQ?si=wQxFsNeKVYJlj8_m"
                    title="YouTube video player" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                <iframe width="560" height="315" src="https://www.youtube.com/embed/tVzUXW6siu0?si=E8LhANyDBEDvu2Cq"
                    title="YouTube video player" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                <iframe width="560" height="315" src="https://www.youtube.com/embed/5xFRg_TzlAg?si=72FqLRtI2NrwhFZW"
                    title="YouTube video player" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </article>
        </section>
        <!-- if i use here Single article tag then it is also fine -->
        <section>
            <h3>2.Entertainment Content</h3>
            <article class="videos">
                <h4>South Indian Song</h4>
                <iframe width="560" height="315" src="https://www.youtube.com/embed/Hh_Vewjk7wo?si=i5n52vQCbLzRjAh3"
                    title="YouTube video player" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                <!-- Mistake is in video tag we don't paste direct youtube links we need a actual .mp3 file in our file -->
                <!-- In this code i does not use much <video> tags bcz i dont have any video files so instead of video tag i use iframe tag -->
                <video height="200" width="200" src="https://youtu.be/KaQ6RgvvT2Q?si=WqBE4PZmsWSsirC1"></video>
                <iframe width=" 560" height="315" src="https://www.youtube.com/embed/-2RAq5o5pwc?si=I2XguBdWTuH94GAW"
                    title="YouTube video player" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </article>
        </section>
    </main>
    <footer>
        <p>MPlayer Security Policies</p>
        <p>Copyright reserved 2020-21 </p>
    </footer>

</body>

</html>
