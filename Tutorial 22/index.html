<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSSResponsiveStudentProfile</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header id="Content1">
        <h1 id="Main_heading">My Student Profile</h1>
    </header>
    <main id="Main_container">
        <section class="Main" id="About">
            <h2>About Me</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Cupiditate sunt maxime commodi cum? Perferendis
                dolorem totam at sapiente iure temporibus.</p>
        </section>
        <section class="Main" id="Skill">
            <h2>Skill</h2>
            <ul id="list">
                <li>HTML</li>
                <li>CSS</li>
                <li>JS</li>
            </ul>
        </section>
        <section class="Main" id="Contact">
            <h2>Contact</h2>
            <label for="email">Enter Email:</label>
            <input type="email" name="main" id="email" placeholder="eg@gmail.com">
            <input type="button" value="Submit" id="btn">
        </section>
    </main>
    <footer id="end_content">
        <p>gaurav</p>
    </footer>
</body>

</html>
